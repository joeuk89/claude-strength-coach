# Coach settings. Copy this file to config.toml in the workspace root and
# edit it. Scripts read it and never write it. Unknown tables and keys are
# errors, so a typo stops the scripts instead of being ignored.
#
# Check it with: python3 -m coach config validate

schema_version = 1

[athlete]
units = "kg"                  # "kg" | "lb": the units for every load. Required.
                              # With "lb", set every [equipment] weight below in lb.
bodyweight_units = "kg"       # "kg" | "lb"; default: the same as units
week_starts = "monday"        # "monday" | "sunday"
timezone = ""                 # IANA name such as "Europe/London"; "" = this computer's local time
experience = "intermediate"   # current level confirmed with the athlete: beginner, intermediate or advanced
# birth_year = 1980           # optional; omitted means unknown, derived age is approximate
# desired_sessions = 4        # sessions wanted each week, separate from available weekdays
available_days = []           # days the athlete can train: "mon" .. "sun"; [] = not stated
session_minutes = 60          # default time cap per session; 0 = no cap

[hevy]
enabled = true                # false if the athlete doesn't log in Hevy
cache_max_age_hours = 24      # `coach check` warns when the Hevy cache is older than this

# The main place the athlete trains. Every weight is in [athlete] units.
# The weights below are commented out. With units = "kg", each one left
# commented takes the kg value shown. With units = "lb", they have no
# default: uncomment and set every one in lb, or validation stops.
# `available` takes only these values: "barbell", "ez_bar", "trap_bar",
# "dumbbell", "kettlebell", "machine", "smith_machine", "cable", "plate",
# "band", "suspension", "bodyweight", "cardio_machine", "other".
[equipment]
available = []                # equipment the athlete has; [] = assume every piece
dumbbells = []                # per-hand dumbbell weights available; [] = not checked
# dumbbell_increment = 2.0    # smallest per-hand dumbbell jump
# dumbbell_max = 40.0         # heaviest per-hand dumbbell; prescriptions are capped here
# barbell_increment = 2.5     # smallest jump in total bar load
# bar_weight = 20.0
# plates = [25, 20, 15, 10, 5, 2.5, 1.25]  # plate sizes you have in pairs, one per side; any number of each
# machine_increment = 5.0
# cable_increment = 2.5

# Other places the athlete trains, one table each. The name uses lowercase
# letters, digits and hyphens. Any [equipment] key may appear; at that place
# it replaces the main table's value, and keys left out keep it.
#
# [equipment.locations.home]
# available = ["dumbbell", "band", "bodyweight"]
# dumbbells = [5, 10, 15, 20]
# dumbbell_max = 20.0

# Optional load caps, by exercise id, in athlete units: per hand for
# dumbbell exercises, total otherwise.
[caps]
# db_bench_press = 30.0

# Optional time caps in minutes, by session id. A session left out uses
# [athlete] session_minutes; 0 means no cap.
# [sessions.cap_minutes]
# session-a = 45

# Check-ins fall due this many days after the last record in check-ins/
# (python3 -m coach checkin due).
[checkin]
cadence_days = 7

# "coach": the coach reviews the program's structure and proposes changes.
# "run": the athlete's own program is run as written. Loads still progress
# and every safety check still runs, but structural flags are shown as
# information and the coach never proposes a restructure or a redesign.
[coaching]
mode = "coach"                # "coach" | "run"

# Nutrition strategy, set by /goals with the athlete's approval. Left out,
# or with enabled = false, nutrition is off: the check-in asks for one
# morning weigh-in and /goals sets things up. Weights are in [athlete]
# bodyweight_units. No key holds a calorie figure the nutrition app owns:
# kcal_target is only for app = "none", and is an error otherwise.
#   protein: floor, target and stretch in grams a day; readings dated on
#     or after floor_since count toward a raise, and floor_step_g is how far
#     the floor rises once average protein meets it at two check-ins running
#     (never above target).
#   anchors: the 2-3 standing protein anchors. days: "daily", "office",
#     "home" or weekday ids "mon" .. "sun". Give kcal and protein_g, or
#     recipe naming a card in nutrition/menu/ instead.
#   override: at most one, expiring no more than 21 days after it starts;
#     renewal is 0 for a first override, 1 once renewed, 2 renewed twice.
# What stays prose in profile.md: the goal in the athlete's words, the
# phase sequence and its triggers, why that protein basis, how the anchors
# were chosen, the sleep gate and the app setup notes.
#
# [nutrition]
# enabled = true
# app = "macrofactor"             # "macrofactor" | "none"
# phase = "recomp"                # "bulk" | "cut" | "maintain" | "recomp"
# target_rate_per_week = 0.0      # bodyweight units a week; negative = loss
# # goal_weight = 78.0
# # kcal_target = 2400            # only with app = "none"
#
# [nutrition.protein]
# reference_basis = "bodyweight"  # "bodyweight" | "goal_weight" | "fat_free_mass"
# reference_mass = 80.0
# floor_g = 110                   # the number entered in the app
# target_g = 128
# stretch_g = 176
# floor_since = 2026-09-28
# floor_step_g = 10
#
# [[nutrition.anchors]]
# name = "Whey shake"
# slot = "snack"
# days = ["daily"]
# kcal = 150
# protein_g = 30
#
# # [nutrition.override]
# # start = 2026-10-11
# # expires = 2026-11-01
# # what = "app protein target held at 120"
# # reason = "..."
# # exit_condition = "..."
# # renewal = 0

# Recipe bank checks (/recipes). Left commented, the values shown apply;
# uncomment [nutrition.bank] to change them.
#   aisles: the shopping walk order; every ingredient names one.
#   min_protein_per_100kcal: warn when a card for that slot has less protein
#     per 100 kcal; 0 = not checked. A heuristic, not an evidence-based cut-off.
#   macro_sum_*_pct: how far a card's kcal may sit from 4 x protein +
#     4 x carbs + 9 x fat (grams) before `recipes validate` warns or fails.
#     Data-entry heuristics that catch typos, not coaching numbers.
#   slot_notes: one line printed under each slot in nutrition/menu/index.md.
#
# [nutrition.bank]
# aisles = ["produce", "bakery", "meat-fish", "dairy-eggs", "chilled", "frozen", "tins-jars-dry", "snacks", "drinks", "household"]
# min_protein_per_100kcal = {breakfast = 5.0, lunch = 5.0, dinner = 5.0, snack = 0.0}
# macro_sum_warn_pct = 10
# macro_sum_fail_pct = 20
#
# [nutrition.bank.slot_notes]
# breakfast = "must be fast or it gets skipped"

# The standing week /meal-plan starts from (python3 -m coach meals template).
# Each week's plan is only the exceptions to it. Optional; without it
# /meal-plan has nothing to start from.
#   slots: the meal slots, in day order; anchors and cards use these names.
#   office_days: weekday ids; "office" and "home" in days lists mean these
#     days and the rest.
#   staples: ingredient items (as cards name them) kept in by default; the
#     shopping list moves them to "check you have".
#   plan_style: "loose" (the pool is fixed, the week table is a suggestion)
#     or "strict"; left out, loose when a standing row covers dinner.
#   kcal_tolerance_pct: how far a day may sit from the calorie target
#     before the plan flags it.
#   shopping_issue: true offers the approved shopping list as a GitHub
#     issue with tick boxes.
#   standing: one row per slot and set of days, each with exactly one of
#     recipe (a card), pool (cards to pick from each week) or cover
#     (someone else decides; give its estimated kcal and protein_g). Two
#     rows may not fill the same slot on the same day.
#
# [nutrition.template]
# slots = ["breakfast", "lunch", "dinner", "snack"]
# office_days = ["tue", "thu"]
# staples = ["eggs", "rolled oats", "olive oil"]
# # plan_style = "loose"
# kcal_tolerance_pct = 15
# shopping_issue = false
#
# [[nutrition.template.standing]]
# days = ["daily"]
# slot = "breakfast"
# recipe = "overnight-oats"
#
# [[nutrition.template.standing]]
# days = ["office"]
# slot = "lunch"
# pool = ["chicken-rice-bowl"]
#
# [[nutrition.template.standing]]
# days = ["mon", "tue", "wed", "thu"]
# slot = "dinner"
# cover = "family"
# kcal = 700
# protein_g = 35

# Activity sources: runs, rides, conditioning and wellness (sleep, resting
# heart rate, steps, body mass) logged outside the lifting log. Manual entry
# is always available; each [sources.<name>] table below turns on one source.
[activity]
enabled = false               # true to use the activity, wellness and planned commands
wellness_in_git = false       # false: wellness lives in .coach/activity/ (gitignored); true: data/activity/ (committed)
dedup_window_minutes = 15     # records of one kind starting this close are one Activity
precedence = ["manual", "apple_health", "hevy_conditioning"]  # which source wins each field; list "manual" and every enabled source once
gap_warn_days = 3             # `coach check` warns when an enabled source's newest day is older than this

[sources.hevy_conditioning]   # Hevy conditioning workouts (all-conditioning exercises, or a routine mapped to a
                              # conditioning session); reads the Hevy cache, never the API
enabled = true                # also needs [hevy] enabled = true

[sources.apple_health]        # Apple Health through the Health Auto Export app: JSON, Export Version 2,
                              # Summarize Data on. Files are read in place, never copied
enabled = false               # true to read the folder on every `activity sync`
path = ""                     # iCloud Drive's AutoExport folder, or any folder holding both automation folders
                              # (each automation exports one data type, so set one up for Health Metrics and one
                              # for Workouts); on a Mac: "~/Library/Mobile Documents/com~apple~CloudDocs/AutoExport"
drop_source_names = ["Hevy"]  # workouts these apps wrote to Apple Health are dropped; with "Hevy" listed, a workout
                              # with no source that starts within dedup_window_minutes of a Hevy workout is dropped too

# Cardio: who owns the run plan, the caps, and the thresholds behind the
# cardio flags. Distances are in distance_unit. Every week is the one
# [athlete] week_starts defines. Numbers marked "a heuristic" are coaching
# judgement, not research cut-offs.
[cardio]
tier = "count"                # "count": no plan, planned activities ignored; "review": an outside plan or the
                              # athlete's, reconciled against what was logged; "program": the coach writes the plan
distance_unit = "km"          # "km" | "mi"
weekly_run_distance = 0       # caps; 0 = no cap
weekly_run_minutes = 0
single_run_distance = 0
single_run_minutes = 0
weekly_quality = 2            # quality activities a week, runs and conditioning together; 0 = no cap
                              # (a heuristic, rn:running-load.5)
spike_ratio = 1.10            # a run longer than this × the longest run in the lookback is a spike, linked to
spike_lookback_days = 30      # more overuse injuries (rn:running-load.1)
spike_min_history_days = 14   # a run is judged only once the logs reach back this far before it
                              # (a heuristic, rn:running-load.4)
sleep_short_hours = 7.0       # a night below this is short; adults need 7 h or more (rn:sleep-dieting.1)
sleep_debt_nights = 4         # short nights of the last 7 that raise sleep_debt (a heuristic)
sleep_min_nights = 4          # nights with data needed to judge (a heuristic)
reconcile_move_days = 3       # a logged activity this many days from its plan still matches that planned activity, as moved
                              # (a heuristic)
quality_rpe_min = 7           # a session RPE at or above this makes an activity a quality one
                              # (a heuristic, rn:running-load.6)
external_session_minutes = 60 # a coach-led session counts as this long at this session RPE
external_session_rpe = 6      # (heuristics, rn:running-load.7)
