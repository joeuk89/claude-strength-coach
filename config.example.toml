# Coach settings. Copy this file to config.toml in the workspace root and
# edit it. Scripts read it and never write it. Unknown tables and keys are
# errors, so a typo stops the scripts instead of being ignored.
#
# Check it with: python3 -m coach config validate

schema_version = 1

[athlete]
units = "kg"                  # "kg" | "lb": the units for every load. Required.
                              # With "lb", set every [equipment] weight below in lb.
bodyweight_units = "kg"       # "kg" | "lb"; default: the same as units
week_starts = "monday"        # "monday" | "sunday"
timezone = ""                 # IANA name such as "Europe/London"; "" = this computer's local time
experience = "intermediate"   # "beginner" | "intermediate" | "advanced"
available_days = []           # days the athlete can train: "mon" .. "sun"; [] = not stated
session_minutes = 60          # default time cap per session; 0 = no cap

[hevy]
enabled = true                # false if the athlete doesn't log in Hevy
cache_max_age_hours = 24      # `coach check` warns when the Hevy cache is older than this

# The main place the athlete trains. Every weight is in [athlete] units.
# The weights below are commented out. With units = "kg", each one left
# commented takes the kg value shown. With units = "lb", they have no
# default: uncomment and set every one in lb, or validation stops.
[equipment]
available = []                # equipment the athlete has; [] = assume every piece (not checked)
dumbbells = []                # per-hand dumbbell weights available; [] = not checked
# dumbbell_increment = 2.0    # smallest per-hand dumbbell jump
# dumbbell_max = 40.0         # heaviest per-hand dumbbell; prescriptions are capped here
# barbell_increment = 2.5     # smallest jump in total bar load
# bar_weight = 20.0
# plates = [25, 20, 15, 10, 5, 2.5, 1.25]  # plate sizes you have in pairs, one per side; any number of each
# machine_increment = 5.0
# cable_increment = 2.5

# Other places the athlete trains, one table each. The name uses lowercase
# letters, digits and hyphens. Any [equipment] key may appear; at that place
# it replaces the main table's value, and keys left out keep it.
#
# [equipment.locations.home]
# available = ["dumbbell", "bench", "band", "bodyweight"]
# dumbbells = [5, 10, 15, 20]
# dumbbell_max = 20.0

# Optional load caps, by exercise id, in athlete units: per hand for
# dumbbell exercises, total otherwise.
[caps]
# db_bench_press = 30.0

# Recipe bank checks (/recipes). Left commented, the values shown apply;
# uncomment [nutrition.bank] to change them.
#   aisles: the shopping walk order; every ingredient names one.
#   min_protein_per_100kcal: warn when a card for that slot has less protein
#     per 100 kcal; 0 = not checked. A heuristic, not an evidence-based cut-off.
#   macro_sum_*_pct: how far a card's kcal may sit from 4 x protein +
#     4 x carbs + 9 x fat (grams) before `recipes validate` warns or fails.
#   slot_notes: one line printed under each slot in nutrition/menu/index.md.
#
# [nutrition.bank]
# aisles = ["produce", "bakery", "meat-fish", "dairy-eggs", "chilled", "frozen", "tins-jars-dry", "snacks", "drinks", "household"]
# min_protein_per_100kcal = {breakfast = 5.0, lunch = 5.0, dinner = 5.0, snack = 0.0}
# macro_sum_warn_pct = 10
# macro_sum_fail_pct = 20
#
# [nutrition.bank.slot_notes]
# breakfast = "must be fast or it gets skipped"

# Activity sources: runs, rides, conditioning and wellness (sleep, resting
# heart rate, steps, body mass) logged outside the lifting log. Manual entry
# is always available; each [sources.<name>] table below turns on one source.
[activity]
enabled = false               # true to use the activity, wellness and planned commands
wellness_in_git = false       # false: wellness lives in .coach/activity/ (gitignored); true: data/activity/ (committed)
dedup_window_minutes = 15     # records of one kind starting this close are one Activity
precedence = ["manual", "apple_health", "hevy_conditioning"]  # which source wins each field; list "manual" and every enabled source once
gap_warn_days = 3             # `coach check` warns when an enabled source's newest day is older than this

[sources.hevy_conditioning]   # Hevy workouts made only of conditioning exercises; reads the Hevy cache, never the API
enabled = true                # also needs [hevy] enabled = true
